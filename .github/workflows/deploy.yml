name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [templates-update]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            docs
            .github

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: Get pip cache directory
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Checkout Templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GhostWriters/DockSTARTer-Templates
          path: templates-repo
          sparse-checkout: |
            docs/apps
            .apps

      - name: Prepare Apps Documentation
        run: |
          mkdir -p docs/apps
          # App docs are README.md, co-located with each app's own template
          # files -- rename to <appname>.md on copy so 198 apps' identically
          # named READMEs don't collide once flattened into docs/apps/.
          for appdir in templates-repo/.apps/*/; do
            appname="$(basename "${appdir}")"
            if [ -f "${appdir}README.md" ]; then
              cp "${appdir}README.md" "docs/apps/${appname}.md"
            fi
          done
          # Orphaned docs with no matching .apps/ folder (e.g. removed/renamed apps).
          cp templates-repo/docs/apps/*.md docs/apps/ 2>/dev/null || true
          rm -rf templates-repo

      - name: Inject Apps Navigation
        run: python .github/scripts/inject_apps_nav.py

      - name: Build documentation
        run: zensical build > build.log 2>&1 || (cat build.log && exit 1)

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-log
          path: build.log

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
