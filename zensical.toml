[project]
site_name = "DockSTARTer"
site_url = "https://dockstarter.com"
site_author = "GhostWriters"
site_description = "DockSTARTer helps you get started with home server apps running in Docker."

repo_name = "GhostWriters/DockSTARTer-Docs"
repo_url = "https://github.com/GhostWriters/DockSTARTer-Docs"
edit_uri = "edit/main/docs/"

copyright = "Copyright &copy; 2023 GhostWriters"

extra_javascript = [
	"https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
	"javascripts/tablesort.js",
]

# Navigation structure and ordering now come from docs/.nav.yml (and a
# .nav.yml per subfolder) via the awesome-nav plugin below, instead of a
# hardcoded array here -- this also gives native glob support for
# apps/*.md, replacing the old inject_apps_nav.py CI workaround.
[project.plugins.awesome-nav]

# fireflyiii/kitana/overseerr/petio/requestrr's override docs were merged
# into their app docs; discord.md and advanced/overrides.md are legacy
# bookmarked paths. All five used to be `template: redirect.html` stub
# pages; the redirects plugin now generates those redirect pages itself.
[project.plugins.redirects]
redirect_maps."discord.md" = "https://discord.gg/xR3cyUb"
redirect_maps."advanced/overrides.md" = "overrides/introduction.md"
redirect_maps."overrides/fireflyiii.md" = "apps/fireflyiii.md"
redirect_maps."overrides/kitana.md" = "apps/kitana.md"
redirect_maps."overrides/overseerr.md" = "apps/overseerr.md"
redirect_maps."overrides/petio.md" = "apps/petio.md"
redirect_maps."overrides/requestrr.md" = "apps/requestrr.md"

# extra.analytics / extra.status are mkdocs-material config keys carried over
# from mkdocs.yml -- unverified whether zensical's bootstrap schema supports
# either; not present (active or commented) in zensical's own bootstrap
# template. Test after build; drop if zensical rejects or silently ignores
# them.
[project.extra.analytics]
provider = "google"
property = "G-QVNLHE95FS"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://dockstarter.com/discord"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GhostWriters/DockSTARTer2"

[project.theme]
name = "material"
language = "en"
favicon = "assets/favicon.ico"
logo = "assets/icon.png"
features = [
	"content.action.edit",
	"content.code.copy",
	"navigation.footer",
	"navigation.instant",
	"navigation.instant.prefetch",
	"navigation.instant.progress",
	"navigation.top",
	"navigation.tracking",
	"search.highlight",
	"toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
